<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>간단 그림판 - 사과 그리기</title>
<style>
  body { font-family: sans-serif; text-align: center; background: #f0f0f0; }
  canvas { border: 2px solid #333; background: white; cursor: crosshair; }
  .controls { margin: 15px; }
  button { padding: 8px 16px; margin: 4px; font-size: 14px; cursor: pointer; }
  button.active { background: #4caf50; color: white; }
  .color { width: 30px; height: 30px; border-radius: 50%; border: 2px solid #666; cursor: pointer; display: inline-block; vertical-align: middle; }
  .color.selected { border-color: black; border-width: 3px; }
  #msg { margin-top: 10px; color: #333; font-weight: bold; }
</style>
</head>
<body>

<h2>🍎 간단 그림판 (브러시 1개)</h2>

<div class="controls">
  <div>색상 선택:</div>
  <div class="color" style="background:#d32f2f;" onclick="setColor('#d32f2f', this)" data-color="#d32f2f"></div>
  <div class="color" style="background:#2e7d32;" onclick="setColor('#2e7d32', this)" data-color="#2e7d32"></div>
  <div class="color" style="background:#5d4037;" onclick="setColor('#5d4037', this)" data-color="#5d4037"></div>
  <div class="color" style="background:#000000;" onclick="setColor('#000000', this)" data-color="#000000"></div>

  <br><br>
  <button onclick="clearCanvas()">지우기</button>
  <button onclick="drawApple()">사과 그리기</button>
</div>

<canvas id="cvs" width="500" height="500"></canvas>
<div id="msg">마우스로 그릴 수 있습니다. '사과 그리기' 버튼을 누르면 사그가 자동으로 그려집니다.</div>

<script>
  const cvs = document.getElementById('cvs');
  const ctx = cvs.getContext('2d');
  let drawing = false;
  let currentColor = '#d32f2f';

  ctx.lineWidth = 5;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  function setColor(color, el) {
    currentColor = color;
    document.querySelectorAll('.color').forEach(c => c.classList.remove('selected'));
    if (el) el.classList.add('selected');
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
  }

  // 기본 색상 설정
  setColor('#d32f2f');

  cvs.addEventListener('mousedown', e => {
    drawing = true;
    ctx.beginPath();
    ctx.moveTo(e.offsetX, e.offsetY);
  });

  cvs.addEventListener('mousemove', e => {
    if (!drawing) return;
    ctx.lineTo(e.offsetX, e.offsetY);
    ctx.stroke();
  });

  cvs.addEventListener('mouseup', () => drawing = false);
  cvs.addEventListener('mouseleave', () => drawing = false);

  function clearCanvas() {
    ctx.clearRect(0, 0, cvs.width, cvs.height);
    document.getElementById('msg').textContent = '캔버스를 지웠습니다.';
  }

  function drawApple() {
    clearCanvas();
    ctx.fillStyle = '#d32f2f';
    ctx.beginPath();
    ctx.arc(250, 260, 70, 0, Math.PI * 2); // 사과 몸통
    ctx.fill();

    // 줄기
    ctx.fillStyle = '#5d4037';
    ctx.fillRect(244, 195, 12, 30);

    // 잎
    ctx.fillStyle = '#2e7d32';
    ctx.beginPath();
    ctx.ellipse(265, 205, 20, 30, -0.5, 0, Math.PI * 2);
    ctx.fill();

    document.getElementById('msg').textContent = '🍎 사과가 그려졌습니다!';
  }
</script>

</body>
</html>
