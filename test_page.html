<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>테스트 페이지</title>
    <style>
        body { font-family: sans-serif; text-align: center; background-color: #f0f0f0; }
        h1 { color: #333; }
        .gallery { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; padding: 20px; }
        .photo-card { background: white; padding: 10px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        img { width: 200px; height: 200px; object-fit: cover; border-radius: 4px; display: block; }
        p { margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>
    <h1>박수한은 탈모이다</h1>
    <div class="gallery">
        <div class="photo-card">
            <img src="https://via.placeholder.com/200?text=Hair+Loss+1" alt="탈모 사진 1">
            <p>증상 1</p>
        </div>
        <div class="photo-card">
            <img src="https://via.placeholder.com/200?text=Hair+Loss+2" alt="탈모 사진 2">
            <p>증상 2</p>
        </div>
        <div class="photo-card">
            <img src="https://via.placeholder.com/200?text=Hair+Loss+3" alt="탈모 사진 3">
            <p>증상 3</p>
        </div>
    </div>
</body>
</html>
